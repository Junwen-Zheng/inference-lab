groups:
  - name: inference-lab
    rules:
      - record: inference_lab:output_tokens_per_second:rate1m
        expr: sum by (model_name) (rate(vllm:generation_tokens_total{job="vllm"}[1m]))
      - record: inference_lab:requests_per_second:rate1m
        expr: sum by (model_name) (rate(vllm:request_success_total{job="vllm",finished_reason=~"stop|length"}[1m]))
      - record: inference_lab:ttft_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:time_to_first_token_seconds_bucket{job="vllm"}[5m])))
      - record: inference_lab:e2e_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, model_name) (rate(vllm:e2e_request_latency_seconds_bucket{job="vllm"}[5m])))
      - alert: VllmTargetUnavailable
        expr: up{job="vllm"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: vLLM metrics target is unavailable.
      - alert: VllmQueueSustained
        expr: sum by (model_name) (vllm:num_requests_waiting{job="vllm"}) > 4
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: vLLM has more than four queued requests.
      - alert: VllmTtftHigh
        expr: inference_lab:ttft_seconds:p95 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: vLLM p95 time to first token exceeds two seconds.
