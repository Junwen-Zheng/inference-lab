apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 2100
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.32.0-cu129
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - $(MODEL_ID)
            - --revision
            - $(MODEL_REVISION)
            - --tokenizer-revision
            - $(MODEL_REVISION)
            - --served-model-name
            - inference-model
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - float16
            - --max-model-len
            - "2048"
            - --max-num-seqs
            - $(MAX_NUM_SEQS)
            - --max-num-batched-tokens
            - $(MAX_NUM_BATCHED_TOKENS)
            - --gpu-memory-utilization
            - "0.85"
            - --no-enable-prefix-caching
            - --generation-config
            - vllm
            - --seed
            - "42"
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: HF_HOME
              value: /cache/huggingface
            - name: VLLM_NO_USAGE_STATS
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 16Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
